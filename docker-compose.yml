version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dreamapt-postgres
    environment:
      POSTGRES_USER: dreamapt
      POSTGRES_PASSWORD: dreamapt
      POSTGRES_DB: dreamapt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dreamapt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
